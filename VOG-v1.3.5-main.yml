name: VOG Windows Build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Unpack the uploaded source ZIP if needed
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $workspace = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          $existing = @(Get-ChildItem -LiteralPath $workspace -Recurse -File -Filter 'build-windows.ps1' -Force | Where-Object {
              $_.Directory.Name -eq 'scripts' -and
              (Test-Path -LiteralPath (Join-Path $_.Directory.Parent.FullName 'CMakeLists.txt') -PathType Leaf) -and
              (Test-Path -LiteralPath (Join-Path $_.Directory.Parent.FullName 'Source/PluginProcessor.cpp') -PathType Leaf)
          })
          if ($existing.Count -gt 0) { Write-Host 'Extracted project files are already present.'; return }
          $archives = @(Get-ChildItem -LiteralPath $workspace -Recurse -File -Filter '*.zip' -Force | Where-Object {
              $archive = $null
              try {
                  $archive = [IO.Compression.ZipFile]::OpenRead($_.FullName)
                  $entries = @($archive.Entries | ForEach-Object { $_.FullName.Replace([char]92,[char]47) })
                  $scripts = @($entries | Where-Object { $_ -match '(^|/)scripts/build-windows[.]ps1$' })
                  $valid = $false
                  foreach ($script in $scripts) {
                      $base = $script.Substring(0,$script.Length-'scripts/build-windows.ps1'.Length)
                      if ($entries -contains ($base+'CMakeLists.txt') -and $entries -contains ($base+'Source/PluginProcessor.cpp')) { $valid = $true }
                  }
                  $valid
              } catch { $false } finally { if ($null -ne $archive) { $archive.Dispose() } }
          })
          if ($archives.Count -eq 0) {
              throw 'No source project was found. Upload VOG-GitHub-Ready.zip to the repository Code page, then commit it. The workflow can unpack that ZIP automatically.'
          }
          if ($archives.Count -gt 1) {
              $preferred = @($archives | Where-Object { $_.Name -eq 'VOG-GitHub-Ready.zip' })
              if ($preferred.Count -eq 1) { $archives = $preferred } else { throw 'Keep one source ZIP in the repository so the workflow can select it.' }
          }
          $zipPath = $archives[0].FullName
          $destination = [IO.Path]::GetFullPath((Join-Path $workspace '.davoe-unpacked'))
          $prefix = $destination.TrimEnd([char]92,[char]47) + [IO.Path]::DirectorySeparatorChar
          $archive = [IO.Compression.ZipFile]::OpenRead($zipPath)
          try {
              foreach ($entry in $archive.Entries) {
                  $relative = $entry.FullName.Replace([char]92,[IO.Path]::DirectorySeparatorChar).Replace([char]47,[IO.Path]::DirectorySeparatorChar)
                  if ([IO.Path]::IsPathRooted($relative)) { throw 'Source ZIP contains an absolute path.' }
                  $target = [IO.Path]::GetFullPath((Join-Path $destination $relative))
                  if ($target -ne $destination -and -not $target.StartsWith($prefix,[StringComparison]::OrdinalIgnoreCase)) { throw 'Source ZIP contains a path outside the extraction folder.' }
              }
          } finally { $archive.Dispose() }
          [IO.Compression.ZipFile]::ExtractToDirectory($zipPath,$destination,$true)
          Write-Host ('Unpacked project source: ' + [IO.Path]::GetRelativePath($workspace,$zipPath))
      - name: Locate and check the complete project
        id: project
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $workspace = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          $rootScript = Join-Path $workspace 'scripts/build-windows.ps1'
          if (Test-Path -LiteralPath $rootScript -PathType Leaf) {
              $projectRoot = $workspace
          } else {
              $candidates = @(Get-ChildItem -LiteralPath $workspace -Recurse -File -Filter 'build-windows.ps1' -Force | Where-Object {
                  $_.Directory.Name -eq 'scripts' -and
                  (Test-Path -LiteralPath (Join-Path $_.Directory.Parent.FullName 'CMakeLists.txt') -PathType Leaf) -and
                  (Test-Path -LiteralPath (Join-Path $_.Directory.Parent.FullName 'Source/PluginProcessor.cpp') -PathType Leaf)
              })
              if ($candidates.Count -eq 0) {
                  throw 'Project files were not found. Extract the source ZIP and upload its contents, including scripts, Source, Tests, assets and CMakeLists.txt. Uploading only a workflow or ZIP is not enough.'
              }
              if ($candidates.Count -ne 1) {
                  throw 'Multiple plugin project folders were found. Keep one project copy in this repository.'
              }
              $projectRoot = $candidates[0].Directory.Parent.FullName
          }
          $required = @('CMakeLists.txt','Source/PluginProcessor.cpp','Source/PluginEditor.cpp',
              'scripts/package-windows.ps1','Source/SynthEngine.h','Source/Parameters.h')
          foreach ($relativeFile in $required) {
              if (-not (Test-Path -LiteralPath (Join-Path $projectRoot $relativeFile) -PathType Leaf)) {
                  throw "Project upload is incomplete: $relativeFile is missing. Upload the full extracted source project."
              }
          }
          $relative = [IO.Path]::GetRelativePath($workspace, $projectRoot).Replace('\','/')
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "root=$relative" -Encoding utf8
          Write-Host "Found plugin project: $relative"
      - name: Build VST3, standalone and DSP tests
        shell: pwsh
        working-directory: ${{ steps.project.outputs.root }}
        run: '& "./scripts/build-windows.ps1" -Configuration Release -Parallel 2'
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: Voice-of-God-Windows-x64
          path: ${{ steps.project.outputs.root }}/dist/Voice-of-God-Windows-x64.zip
          if-no-files-found: error
      - name: Upload corresponding project and fetched dependency source
        uses: actions/upload-artifact@v4
        with:
          name: Voice-of-God-Build-Source
          include-hidden-files: true
          path: |
            ${{ steps.project.outputs.root }}/Source/
            ${{ steps.project.outputs.root }}/Tests/
            ${{ steps.project.outputs.root }}/scripts/
            ${{ steps.project.outputs.root }}/.github/workflows/
            ${{ steps.project.outputs.root }}/CMakeLists.txt
            ${{ steps.project.outputs.root }}/README.md
            ${{ steps.project.outputs.root }}/INSTALL.md
            ${{ steps.project.outputs.root }}/VALIDATION.md
            ${{ steps.project.outputs.root }}/CHANGELOG.md
            ${{ steps.project.outputs.root }}/PRESETS.md
            ${{ steps.project.outputs.root }}/docs/
            ${{ steps.project.outputs.root }}/LICENSE
            ${{ steps.project.outputs.root }}/THIRD_PARTY.md
            ${{ steps.project.outputs.root }}/build/_deps/juce-src/
            !${{ steps.project.outputs.root }}/build/_deps/juce-src/.git/**
          if-no-files-found: error

