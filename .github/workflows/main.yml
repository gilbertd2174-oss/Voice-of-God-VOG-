name: VOG Windows Build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Locate and unpack VOG 1.7.16 source
        id: project
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $workspace = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          $zipName = 'VOG-v1.7.16-GitHub-Ready.zip'
          $version = '(?im)^\s*project\s*\(\s*DavoeAnalogSynthesizer\s+VERSION\s+1[.]7[.]16(?=\s|\))'
          $required = @('CMakeLists.txt','Source/PluginProcessor.cpp','Source/PluginEditor.cpp',
              'Source/SynthEngine.h','Source/Parameters.h','Tests/EngineTests.cpp',
              'scripts/build-windows.ps1','scripts/package-windows.ps1')

          # Recognize the correct build by its project and version, even if the ZIP was renamed.
          $matchesByVersion = @(foreach ($file in (Get-ChildItem -LiteralPath $workspace -Recurse -File -Filter '*.zip' -Force | Sort-Object FullName)) {
              $archive = $null
              try {
                  $archive = [IO.Compression.ZipFile]::OpenRead($file.FullName)
                  $entries = @{}
                  foreach ($entry in $archive.Entries) {
                      $entries[$entry.FullName.Replace([char]92,[char]47)] = $entry
                  }
                  $roots = @(foreach ($key in $entries.Keys) {
                      if ($key -notmatch '(^|/)CMakeLists[.]txt$') { continue }
                      $root = $key.Substring(0,$key.Length-'CMakeLists.txt'.Length)
                      $missing = @($required | Where-Object { -not $entries.ContainsKey($root+$_) })
                      if ($missing.Count -gt 0) { continue }
                      $reader = [IO.StreamReader]::new($entries[$key].Open())
                      try { if ($reader.ReadToEnd() -match $version) { $root } }
                      finally { $reader.Dispose() }
                  })
                  if ($roots.Count -eq 1) {
                      [pscustomobject]@{ Path = $file.FullName; Root = $roots[0] }
                  } else {
                      Write-Host ('Skipped ZIP without exactly one complete VOG 1.7.16 project: ' + [IO.Path]::GetRelativePath($workspace,$file.FullName))
                  }
              } catch {
                  Write-Host ('Could not read ZIP: ' + [IO.Path]::GetRelativePath($workspace,$file.FullName))
              } finally {
                  if ($null -ne $archive) { $archive.Dispose() }
              }
          })

          if ($matchesByVersion.Count -gt 0) {
              $canonical = Join-Path $workspace $zipName
              $preferred = @($matchesByVersion | Where-Object { $_.Path -eq $canonical })
              if ($preferred.Count -eq 1) {
                  $selected = $preferred[0]
              } else {
                  if ($matchesByVersion.Count -gt 1) {
                      $hashes = @($matchesByVersion | ForEach-Object { (Get-FileHash -LiteralPath $_.Path -Algorithm SHA256).Hash } | Sort-Object -Unique)
                      if ($hashes.Count -gt 1) {
                          $paths = ($matchesByVersion | ForEach-Object { [IO.Path]::GetRelativePath($workspace,$_.Path) }) -join ', '
                          throw "Found different VOG 1.7.16 ZIPs ($paths). Upload the intended ZIP to the repository root as $zipName."
                      }
                  }
                  $selected = $matchesByVersion[0]
              }
              $zipPath = $selected.Path
              $destination = [IO.Path]::GetFullPath((Join-Path $workspace '.davoe-unpacked'))
              if (Test-Path -LiteralPath $destination) { throw 'The .davoe-unpacked folder is reserved for the build. Move that checked-in folder to another name.' }
              $prefix = $destination.TrimEnd([char]92,[char]47) + [IO.Path]::DirectorySeparatorChar
              $archive = [IO.Compression.ZipFile]::OpenRead($zipPath)
              try {
                  foreach ($entry in $archive.Entries) {
                      $relative = $entry.FullName.Replace([char]92,[IO.Path]::DirectorySeparatorChar).Replace([char]47,[IO.Path]::DirectorySeparatorChar)
                      if ([IO.Path]::IsPathRooted($relative)) { throw 'Source ZIP contains an absolute path.' }
                      $target = [IO.Path]::GetFullPath((Join-Path $destination $relative))
                      if ($target -ne $destination -and -not $target.StartsWith($prefix,[StringComparison]::OrdinalIgnoreCase)) { throw 'Source ZIP contains a path outside the extraction folder.' }
                  }
              } finally { $archive.Dispose() }
              [IO.Compression.ZipFile]::ExtractToDirectory($zipPath,$destination)
              $projectRoot = $destination
              if ($selected.Root) { $projectRoot = Join-Path $destination $selected.Root }
              Write-Host ('Unpacked VOG 1.7.16 source: ' + [IO.Path]::GetRelativePath($workspace,$zipPath))
          } else {
              $projects = @(foreach ($script in (Get-ChildItem -LiteralPath $workspace -Recurse -File -Filter 'build-windows.ps1' -Force)) {
                  if ($script.Directory.Name -ne 'scripts') { continue }
                  $root = $script.Directory.Parent.FullName
                  $missing = @($required | Where-Object { -not (Test-Path -LiteralPath (Join-Path $root $_) -PathType Leaf) })
                  if ($missing.Count -eq 0 -and [IO.File]::ReadAllText((Join-Path $root 'CMakeLists.txt')) -match $version) { $root }
              })
              if ($projects.Count -eq 0) { throw "No complete VOG 1.7.16 source found in this commit. Upload $zipName to the Code page and commit it." }
              if ($projects.Count -gt 1 -and $projects -notcontains $workspace) { throw "Found multiple extracted VOG 1.7.16 projects. Upload the intended project as $zipName at the repository root." }
              $projectRoot = if ($projects -contains $workspace) { $workspace } else { $projects[0] }
          }

          foreach ($relativeFile in $required) {
              if (-not (Test-Path -LiteralPath (Join-Path $projectRoot $relativeFile) -PathType Leaf)) {
                  throw "Project upload is incomplete: $relativeFile is missing."
              }
          }
          $relative = [IO.Path]::GetRelativePath($workspace, $projectRoot).Replace('\','/')
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "root=$relative" -Encoding utf8
          Write-Host "Found VOG 1.7.16 project: $relative"
      - name: Build VST3, standalone and DSP tests
        shell: pwsh
        working-directory: ${{ steps.project.outputs.root }}
        run: '& "./scripts/build-windows.ps1" -Configuration Release -Parallel 2'
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: Voice-of-God-Windows-x64-v1.7.16
          path: ${{ steps.project.outputs.root }}/dist/Voice-of-God-Windows-x64.zip
          if-no-files-found: error
      - name: Upload corresponding project and fetched dependency source
        uses: actions/upload-artifact@v4
        with:
          name: Voice-of-God-Build-Source
          include-hidden-files: true
          path: |
            ${{ steps.project.outputs.root }}/Source/
            ${{ steps.project.outputs.root }}/Tests/
            ${{ steps.project.outputs.root }}/scripts/
            ${{ steps.project.outputs.root }}/.github/workflows/
            ${{ steps.project.outputs.root }}/CMakeLists.txt
            ${{ steps.project.outputs.root }}/README.md
            ${{ steps.project.outputs.root }}/INSTALL.md
            ${{ steps.project.outputs.root }}/VALIDATION.md
            ${{ steps.project.outputs.root }}/CHANGELOG.md
            ${{ steps.project.outputs.root }}/PRESETS.md
            ${{ steps.project.outputs.root }}/docs/
            ${{ steps.project.outputs.root }}/LICENSE
            ${{ steps.project.outputs.root }}/THIRD_PARTY.md
            ${{ steps.project.outputs.root }}/build/_deps/juce-src/
            !${{ steps.project.outputs.root }}/build/_deps/juce-src/.git/**
          if-no-files-found: error
